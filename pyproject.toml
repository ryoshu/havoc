[project]
name = "gia"
version = "0.2.0"
description = "Affordance-driven TTRPG backend — Eat the Reich (Havoc Engine)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0,<3",
    "openai>=1.0.0",
    "certifi>=2024.2.2",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "pyoxigraph>=0.4.0",
    "pymupdf>=1.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
