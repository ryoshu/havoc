[project]
name = "gia"
version = "0.2.0"
description = "Affordance-driven TTRPG backend — Eat the Reich (Havoc Engine)"
requires-python = ">=3.11"
# `mcp[cli]` moved to the `mcp` optional-dependency group below in PR 17
# (`docs/GIA-GAS-SEPARATION-EXECUTION-PLAN.md`): the reusable cores
# (`gia_core`, `gas_protocol`, `gia_gas_adapter`, and now bare `gia` itself
# — `src/gia/server.py`'s `mcp`/`_allowed_hosts` re-export is lazy, see its
# module docstring) must install and import without MCP. Anything that
# needs to actually run the MCP server (`gas_mcp`, `havoc_server`, or
# `uv run python -m src.gia.server`) needs the `mcp` extra.
dependencies = [
    "openai>=1.0.0",
    "certifi>=2024.2.2",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "pyoxigraph>=0.4.0",
    "pymupdf>=1.27.0",
]

[project.optional-dependencies]
mcp = [
    "mcp[cli]>=2.0,<3",
]
# `test` pulls in the `mcp` extra (rather than just pytest) because the test
# suite itself covers MCP transport (tests/test_mcp_v2.py, test_gas_mcp.py,
# test_havoc_server.py, test_renderers.py, ...) and imports `mcp` directly.
# `uv sync --locked --extra test` is this repo's one documented setup
# command (CLAUDE.md, docs/OPERATIONS.md); it must be sufficient to collect
# and run the full suite. This does not weaken PR 17's "reusable cores
# install without mcp" claim — that claim is about `gia_core`/`gas_protocol`/
# `gia_gas_adapter`/bare `gia` with *no* extras installed, verified via a
# clean-venv wheel install (see docs/gia2/DEPENDENCY-BOUNDARIES.md's "PR 17
# status"), not about this dev-only test convenience group.
test = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "gia[mcp]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `gia_core` is a second top-level distribution package (PR 14 of the
# GIA/GAS 2.0 plan): src/gia/* now imports it at runtime (e.g.
# `src/gia/domain.py` re-exporting its error hierarchy), so it must ship
# alongside `gia`, not just live as a source-tree-only namespace. Without
# this, hatchling's src-layout default (a single package matching the
# project name) would silently omit gia_core and `import gia.server` would
# fail once installed.
#
# `gas_protocol` (PR 15) is added proactively for the same reason, rather
# than reactively after a broken install like gia_core was: PR 15's own
# exit criteria is that GAS can be installed and imported without GIA, and
# that claim isn't real until the wheel actually contains it.
#
# `gia_gas_adapter` (PR 16) ships for the same proactive reason: it's no
# longer an empty placeholder, and it imports both `gia_core` and `gia`
# (`gia.capabilities`/`gia.policy`) at runtime — both already ship, so this
# adds no new transitive gap.
#
# `gas_mcp` and `havoc_server` (PR 17) ship for the same reason: both
# stopped being empty placeholders. `gas_mcp` needs the `mcp` extra
# installed to actually import (it registers MCP tools); `havoc_server`
# additionally needs `gia`/`gia_gas_adapter`/`gas_protocol`, all of which
# already ship.
#
# `havoc_domain` (PR 18) ships for the same reason: it's no longer an empty
# placeholder — it now holds the concrete Havoc game code (GameContext,
# GameDB, GameGraph, HavocEngine, the command kernel/execution service, and
# HavocGiaApplication) moved out of `src/gia/*`, which now hold only thin
# re-export shims at the old import paths. This was the last of the six
# target namespaces from docs/gia2/DEPENDENCY-BOUNDARIES.md to ship.
packages = [
    "src/gia",
    "src/gia_core",
    "src/gas_protocol",
    "src/gia_gas_adapter",
    "src/gas_mcp",
    "src/havoc_server",
    "src/havoc_domain",
]
