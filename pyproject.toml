[project]
name = "havoc"
version = "0.2.0"
description = "Eat the Reich application built on GIA and GAS (Havoc Engine)"
requires-python = ">=3.11"
# The repository split turned this repo into a uv workspace
# (`[tool.uv.workspace]` below): `gia_core`, `gas_protocol`,
# `gia_gas_adapter`, and `gas_mcp` are now genuinely separate distributions
# under `packages/*` (checked out as Git submodules), each built and installed in isolation by
# `scripts/verify_wheel_isolation.py` before this root project's own build
# is trusted. This project is the Havoc application distribution. It depends
# on the first three unconditionally: `havoc_domain`/`havoc_server.runtime`
# import `gia_core` and `gas_protocol` at module level, and the runtime builds
# a `GiaGasAdapter`
# unconditionally too. `gas_mcp` stays behind the `mcp` extra below, same as
# the `mcp` SDK itself — nothing here needs it merely to import the Havoc
# runtime or
# `havoc_domain`, only to actually run `havoc_server`.
dependencies = [
    "gia-core>=0.2,<0.3",
    "gas-protocol>=0.2,<0.3",
    "gia-gas-adapter>=0.2,<0.3",
    "openai>=1.0.0",
    "certifi>=2024.2.2",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "pyoxigraph>=0.4.0",
    "pymupdf>=1.27.0",
]

[project.optional-dependencies]
mcp = [
    "mcp[cli]>=2.0,<3",
    "gas-mcp[mcp]>=0.2,<0.3",
]
# `test` pulls in the `mcp` extra (rather than just pytest) because the test
# suite itself covers MCP transport (tests/test_mcp_v2.py, test_gas_mcp.py,
# test_havoc_server.py, test_renderers.py, ...) and imports `mcp` directly.
# `uv sync --locked --extra test` is this repo's one documented setup
# command (CLAUDE.md, docs/OPERATIONS.md); it must be sufficient to collect
# and run the full suite. This does not weaken PR 17's "reusable cores
# install without mcp" claim — that claim is about `gia_core`/`gas_protocol`/
# `gia_gas_adapter`/the Havoc runtime with *no* extras installed, verified via a
# clean-venv wheel install and the import-boundary checker, not about this
# dev-only test convenience group.
test = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "havoc[mcp]",
]

[tool.uv.sources]
# Resolve the four `packages/*` workspace members from the checked-out
# submodule tree rather than PyPI (RS-04–RS-08). Each member owns its source under
# `packages/*` directly.
gia-core = { workspace = true }
gas-protocol = { workspace = true }
gia-gas-adapter = { workspace = true }
gas-mcp = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `gia_core`, `gas_protocol`, `gia_gas_adapter`, and `gas_mcp` moved out of
# this list in RS-04: they now ship as
# their own workspace-member distributions under `packages/*` (declared as
# dependencies above) rather than being bundled again into this wheel. This
# is deliberate, not an oversight — bundling them here too would silently
# defeat the point of RS-04, which is proving each of those four installs
# and imports in real isolation.
#
# RS-09 makes this wheel the Havoc application distribution. It owns the
# domain, composition root, native MCP renderer, playthrough runner, demo,
# and agent CLI. The reusable cores arrive through their workspace-member
# dependencies rather than being bundled here.
packages = [
    "src/havoc_server",
    "src/havoc_domain",
    "src/playthrough",
    "src/agent",
    "src/demo",
]

# P1 fix (review of RS-04, commit 997a070): the root wheel packaged only
# Python directories, silently omitting `data/` and `ontology/` — both live
# at the repo root, siblings of `src/`, not under any packaged directory.
# `GameContext._load_data` treats missing template files as "load nothing"
# rather than erroring, so an installed wheel booted with zero
# character/enemy/location templates and no test caught it. force-include
# copies both into the wheel *inside* the `havoc_domain` package at build
# time (verified empirically: hatchling supports directory-to-directory
# force-include, no repo-tree move needed); `havoc_domain/context.py`'s
# `DATA_DIR`/`ONTOLOGY_PATH` now look here first via `importlib.resources`,
# falling back to the repo-root-relative layout for editable/dev-tree
# installs, where this packaged copy doesn't exist.
[tool.hatch.build.targets.wheel.force-include]
"data" = "havoc_domain/data"
"ontology" = "havoc_domain/ontology"
